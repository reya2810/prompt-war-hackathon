services:
  - type: web
    name: skillpath-ai
    env: python
    buildCommand: ./build.sh
    startCommand: python3 -m uvicorn app.main:app --app-dir ./backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PROJECT_NAME
        value: SkillPath AI
      - key: DATABASE_URL
        value: sqlite:///./skillpath.db
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: mock
      - key: GEMINI_API_KEY
        sync: false

